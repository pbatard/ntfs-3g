name: UEFI driver - Linux (gcc with EDK2) build

on: [push, pull_request]

env:
  COMPILER: GCC
  EDK2_STABLE_TAG: edk2-stable202605
  GCC_AARCH64_PREFIX: aarch64-linux-gnu-
  GCC_RISCV64_PREFIX: riscv64-linux-gnu-
  GCC_LOONGARCH64_PREFIX: loongarch64-unknown-linux-gnu-
  LOONGARCH64_TOOLCHAIN_TAG: 2025.08.08
  LOONGARCH64_TOOLCHAIN_NAME: x86_64-cross-tools-loongarch64-binutils_2.45-gcc_15.1.0-glibc_2.42.tar.xz

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [X64, IA32, AARCH64, RISCV64, LOONGARCH64]
        include:
        - arch: X64
          short: x64
          pkgs: nasm python3-setuptools uuid-dev
        - arch: IA32
          short: ia32
          pkgs: gcc-multilib nasm python3-setuptools uuid-dev
        - arch: AARCH64
          short: aa64
          pkgs: gcc-aarch64-linux-gnu python3-setuptools uuid-dev
        - arch: RISCV64
          short: riscv64
          pkgs: gcc-riscv64-linux-gnu python3-setuptools uuid-dev
        - arch: LOONGARCH64
          short: loongarch64
          pkgs: gcc-multilib python3-setuptools uuid-dev

    steps:
    - name: Check out repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set version
      id: set_version
      run: echo "version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install ${{ matrix.pkgs }}
        if [[ "${{ matrix.arch }}" == "LOONGARCH64" ]]; then
          curl -L -O https://github.com/loongson/build-tools/releases/download/${LOONGARCH64_TOOLCHAIN_TAG}/${LOONGARCH64_TOOLCHAIN_NAME}
          tar -xJf ${LOONGARCH64_TOOLCHAIN_NAME}
          echo "$PWD/cross-tools/bin" >> "$GITHUB_PATH"
        fi

    - name: Fix missing Risc-V header
      if: matrix.arch == 'RISCV64'
      run: sudo ln -s /usr/riscv64-linux-gnu/include/gnu/stubs-lp64d.h /usr/riscv64-linux-gnu/include/gnu/stubs-lp64.h

    - name: Set up EDK2
      run: |
        git clone --depth 1 --branch ${EDK2_STABLE_TAG} --recursive https://github.com/tianocore/edk2.git
        make -C edk2/BaseTools

    - name: Build UEFI drivers
      run: |
        export WORKSPACE=$PWD
        export PACKAGES_PATH=$WORKSPACE:$WORKSPACE/edk2
        source edk2/edksetup.sh
        build -a ${{ matrix.arch }} -b RELEASE -t ${{ env.COMPILER }} -p uefi-driver.dsc -D COMMIT_INFO=${GITHUB_SHA:0:8} -D DRIVER_VERSION=${{ steps.set_version.outputs.version }}
        mv $WORKSPACE/Build/RELEASE_${{ env.COMPILER }}/${{ matrix.arch }}/ntfs.efi $WORKSPACE/ntfs_${{ matrix.short }}.efi
        build -a ${{ matrix.arch }} -b RELEASE -t ${{ env.COMPILER }} -p uefi-driver.dsc -D FORCE_READONLY -D COMMIT_INFO=${GITHUB_SHA:0:8} -D DRIVER_VERSION=${{ steps.set_version.outputs.version }}
        mv $WORKSPACE/Build/RELEASE_${{ env.COMPILER }}/${{ matrix.arch }}/ntfs.efi $WORKSPACE/ntfs_${{ matrix.short }}_ro.efi
        build -a ${{ matrix.arch }} -b DEBUG -t ${{ env.COMPILER }} -p uefi-driver.dsc -D COMMIT_INFO=${GITHUB_SHA:0:8} -D DRIVER_VERSION=${{ steps.set_version.outputs.version }}
        mv $WORKSPACE/Build/DEBUG_${{ env.COMPILER }}/${{ matrix.arch }}/ntfs.efi "$WORKSPACE/ntfs_${{ matrix.short }} (DEBUG).efi"

    - name: Display SHA-256
      run: sha256sum *.efi

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ntfs_${{ matrix.short }}
        path: ./*.efi

    - name: Create release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ./*.efi
